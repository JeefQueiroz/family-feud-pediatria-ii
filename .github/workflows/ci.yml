name: Family Feud CI
on:
  push:
    branches:
      - main
      - feature/supabase-remote-control
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate JavaScript syntax
        run: |
          node --check public/assets/app.js
          node --check public/assets/remote-sync.js
      - name: Build approved question data
        run: python scripts/build_questions.py
      - name: Check content, scoring and answers
        run: python -m unittest discover -s tests -v
      - name: Run admin/TV browser integration tests
        run: python tests/browser_check.py
